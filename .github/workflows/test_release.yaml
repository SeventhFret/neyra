name: Test Release Permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show token permissions context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "SHA: $GITHUB_SHA"

      - name: Create test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-release-test-${GITHUB_RUN_NUMBER}"

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "CI release test" \
            --notes "Temporary release created to verify GITHUB_TOKEN permissions."
