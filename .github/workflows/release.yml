name: Build and Release Neyra

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_body: ${{ steps.release.outputs.release_body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or find GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          RELEASE_ID="$(
            gh release view "$TAG" \
              --json databaseId \
              --jq '.databaseId' \
              2>/dev/null || true
          )"

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating release for ${TAG}"

            gh release create "$TAG" \
              --verify-tag \
              --title "Neyra ${TAG}" \
              --generate-notes

            RELEASE_ID="$(
              gh release view "$TAG" \
                --json databaseId \
                --jq '.databaseId'
            )"
          else
            echo "Release for ${TAG} already exists"
          fi

          RELEASE_BODY="$(
            gh release view "$TAG" \
              --json body \
              --jq '.body'
          )"

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

          {
            echo "release_body<<EOF"
            echo "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release ID: $RELEASE_ID"

  build:
    needs: create-release

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Set package.json version
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version \
            --allow-same-version

      - name: Set Cargo.toml version
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re

          version = "${{ steps.version.outputs.version }}"
          path = pathlib.Path("src-tauri/Cargo.toml")

          text = path.read_text()

          text, count = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update [package] version in src-tauri/Cargo.toml"
              )

          path.write_text(text)
          PY

      - name: Verify versions
        shell: bash
        run: |
          node -e "console.log('package.json:', require('./package.json').version)"
          grep -A5 '^\[package\]' src-tauri/Cargo.toml

      - name: Build Neyra
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"

        with:
          args: ${{ matrix.args }}

          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-release.outputs.release_body }}

          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: true

          releaseAssetNamePattern: "Neyra_[version]_[platform]_[arch][setup][ext]"
